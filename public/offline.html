<!DOCTYPE html>
<html lang="id" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Offline</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="icon" href="assets/image/favicon.png" type="image/png" />
        <style>
            body {
                min-height: 100vh;
                overflow: hidden;
            }
            /* Dark Gradient Background */
            .dark .gradient-bg-dark {
                background: linear-gradient(
                    135deg,
                    #064e3b,
                    #134e4a
                ); /* Dark Green/Teal */
            }

            /* Orb Styling for Dark Mode */
            .dark .orb {
                position: absolute;
                border-radius: 50%;
                /* Use lighter, more vibrant orb colors for dark bg */
                background-color: rgba(
                    16,
                    185,
                    129,
                    0.15
                ); /* Brighter Emerald */
                filter: blur(10px); /* Slightly more blur */
                z-index: 0;
                animation: float 15s infinite ease-in-out;
            }

            .dark .orb-1 {
                width: 180px;
                height: 180px;
                top: 10%;
                left: 5%;
                animation-duration: 18s;
            }
            .dark .orb-2 {
                width: 90px;
                height: 90px;
                top: 30%;
                left: 80%;
                animation-duration: 12s;
                animation-delay: -3s;
                background-color: rgba(94, 234, 212, 0.15);
            } /* Brighter Teal */
            .dark .orb-3 {
                width: 140px;
                height: 140px;
                top: 70%;
                left: 15%;
                animation-duration: 16s;
                animation-delay: -7s;
            }
            .dark .orb-4 {
                width: 70px;
                height: 70px;
                top: 85%;
                left: 70%;
                animation-duration: 14s;
                animation-delay: -5s;
                background-color: rgba(52, 211, 153, 0.15);
            } /* Brighter Green */
            .dark .orb-5 {
                width: 110px;
                height: 110px;
                top: 50%;
                left: 40%;
                animation-duration: 20s;
                animation-delay: -10s;
            }

            /* Floating Animation */
            @keyframes float {
                0%,
                100% {
                    transform: translateY(0) translateX(0);
                }
                25% {
                    transform: translateY(-25px) translateX(20px);
                }
                50% {
                    transform: translateY(15px) translateX(-15px);
                }
                75% {
                    transform: translateY(-20px) translateX(25px);
                }
            }

            /* Ensure main content is above orbs */
            .content-card {
                position: relative;
                z-index: 10;
            }
        </style>
    </head>
    <body
        class="bg-gray-900 flex items-center justify-center min-h-screen p-6 relative"
    >
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>

        <div
            class="content-card bg-gray-800 rounded-2xl shadow-xl max-w-lg w-full text-center overflow-hidden border border-gray-700"
        >
            <div class="gradient-bg-dark text-white p-8">
                <h1 class="text-3xl font-bold mb-2 text-gray-100">
                    Oops! Koneksi Terputus
                </h1>
                <p class="text-gray-300">Sepertinya Anda sedang offline.</p>
            </div>

            <div class="p-8">
                <p class="text-gray-400 mb-8 leading-relaxed">
                    Kami tidak dapat memuat halaman ini karena tidak ada koneksi
                    internet. Silakan periksa jaringan Anda dan coba lagi.
                </p>
            </div>
        </div>
    </body>
</html>
